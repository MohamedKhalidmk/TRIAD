[pytest]
pythonpath = src/backend
testpaths = src/backend/tests
markers =
    slow: tests that load the full Synthea data (about 5 seconds)
    virtuoso: tests that need a running Virtuoso; skipped when the endpoint does not answer
    kg: tests on a knowledge-graph store (the KG parameters of the store fixtures); -m "not kg" runs only SQLite
    stores(*names): run the store fixtures of a test only on these stores, for example stores("oxigraph")
addopts = -ra
